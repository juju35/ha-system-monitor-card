name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump "version" in package.json, add its CHANGELOG.md section, push, and the release follows.
# Run it by hand with "overwrite" to refresh the notes and the file of the current version's release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Overwrite the notes and the file of the existing release for this version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check build and notes
        if: steps.version.outputs.exists == 'false' || inputs.overwrite
        run: |
          npm run check
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false' || inputs.overwrite
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/system-monitor-card.js
          body_path: notes.md
          make_latest: true
